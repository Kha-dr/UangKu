  <style>
    .app-header {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .app-header img {
      width: 15dvw;
    }

    @media (orientation: portrait) {
      .app-header img {
        width: 40dvw;
      }
    }

    nav.container-full {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1030;
      pointer-events: none;
    }

    nav.container-full .col {
      pointer-events: none;
    }

    nav.container-full .nav-container {
      position: relative;
      pointer-events: auto;
    }

    nav.container-full .navbar {
      --nav-min-height: 6rem;
      --nav-background-color: var(--primary-color);
      --nav-box-shadow: 0px -2px 6px 5px color-mix(in srgb, var(--shadow-color, var(--black-color)) 25%, transparent);
      box-shadow: var(--nav-box-shadow);
      -webkit-box-shadow: var(--nav-box-shadow);
      -moz-box-shadow: var(--nav-box-shadow);
      background: var(--nav-background-color);
      border-radius: 10vh 10vh 0 0;
      min-height: var(--nav-min-height) !important;
      z-index: 999;
      display: flex;
      padding-inline: 2rem;
      justify-content: space-evenly;
      flex-wrap: nowrap;
      flex-direction: row;
    }

    nav.container-full .navbar .nav-link {
      flex: 1 1 0;
      font-weight: 900;
      border: none;
      font-size: 1.5em;
      color: var(--white-color) !important;
      position: relative;
      transition: all 0.2s;
      background: transparent;
    }

    nav.container-full .navbar .nav-link,
    nav.container-full .navbar .nav-link .special {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    nav.container-full .navbar .nav-link .special {
      color: inherit;
      font-size: 1.5em;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -85%);
      padding: 0.75em;
      border-radius: 50%;
      background-color: var(--secondary-color-alt);
      box-shadow: var(--nav-box-shadow);
      border: 0.3rem solid var(--bg-color);
      transition: all 0.1s;
    }

    nav.container-full .navbar .nav-link .special:focus,
    nav.container-full .navbar .nav-link .special:active,
    nav.container-full .navbar .nav-link .special:hover {
      font-size: 1.52em;
    }

    nav.container-full .navbar .nav-link .special.my-tooltip::after {
      font-size: 0.3em;
      font-weight: 700;
      top: 65%;
    }

    nav.container-full .navbar .nav-link:focus,
    nav.container-full .navbar .nav-link:active,
    nav.container-full .navbar .nav-link:hover {
      font-size: 1.7em;
    }

    nav.container-full .navbar-collapse {
      box-shadow: 0px -5px 4px 3px color-mix(in srgb, var(--shadow-color, var(--black-color)) 25%, transparent);
      border-radius: 5vh 5vh 0 0;
      bottom: 0;
      left: 0;
      padding-top: 2vh;
      position: absolute;
      width: 100%;
      background: var(--white-color);
    }

    nav.container-full .navbar-collapse .navbar-more .nav-link {
      padding-block: 1rem;
      padding-inline: 3rem;
      color: var(--secondary-color);
      font-weight: 500;
    }

    nav.container-full .navbar-collapse .navbar-more .nav-link:hover,
    nav.container-full .navbar-collapse .navbar-more .nav-link:active,
    nav.container-full .navbar-collapse .navbar-more .nav-link:focus {
      color: var(--primary-color);
      font-weight: 700;
      border-block: 5px solid;
      border-image-source: linear-gradient(to left, transparent 20%, var(--primary-color) 50%, transparent 80%);
      border-image-slice: 1;
    }

    nav.container-full .navbar-collapse.show::before {
      content: '';
      z-index: -1;
      background: repeating-linear-gradient(
        45deg,
        color-mix(in srgb, var(--shadow-color, var(--black-color)) 20%, transparent),
        color-mix(in srgb, var(--shadow-color, var(--black-color)) 20%, transparent) 1px,
        color-mix(in srgb, var(--shadow-color, var(--black-color)) 30%, transparent) 1px,
        color-mix(in srgb, var(--shadow-color, var(--black-color)) 30%, transparent) 20px
      );
      backdrop-filter: blur(3px);
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
    }

    body:has(.navbar-collapse.show) {
      overflow-y: hidden;
    }
  </style>
</head>

<body>
  <div class="loading-Page">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div id="toast-container">
    <div id="toast-template" class="toast hide border" role="alert" aria-live="assertive" aria-atomic="true"
      data-bs-delay="5000" data-bs-dismiss="toast">
      <div class="toast-header">
        <strong class="me-auto text-white">Pemberitahuan</strong>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body">
        Pesan notifikasi
      </div>
    </div>
  </div>

  <header class="container pt-3 pb-2">
    <div class="app-header position-relative">
      <img src="./assets/img/logo.png" alt="KasIn Logo">
      <h4 id="page-subtitle" class="text-center text-secondary fw-bold mb-1"></h4>
    </div>
  </header>

  <div id="pwa-install-banner" class="container d-none" style="max-width: 720px;">
    <div class="card border-0 shadow-sm rounded-4 px-3 py-2 mb-2 d-flex flex-row align-items-center justify-content-between gap-2">
      <div class="d-flex align-items-center gap-2 min-w-0">
        <img src="./assets/icon/android-icon-48x48.png" alt="KasIn" width="28" height="28" class="rounded-2 flex-shrink-0">
        <span class="small fw-semibold text-truncate">Pasang KasIn di perangkat Anda</span>
      </div>
      <div class="d-flex align-items-center gap-2 flex-shrink-0">
        <button id="btn-pwa-install" type="button" class="btn btn-sm rounded-pill px-3 fw-semibold" style="background-color: var(--primary-color); color: #fbfbfb; border: none;">Pasang</button>
        <button id="btn-pwa-install-dismiss" type="button" class="btn btn-sm btn-link text-secondary p-1 text-decoration-none" aria-label="Tutup banner"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>

  <main id="app-view" class="pb-5"></main>

  <div style="height: 18dvh;"></div>
  <nav class="container-full row">
    <div class="col"></div>
    <div class="col-xxl-3 col-lg-5 p-0 nav-container">
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <div class="navbar-more d-flex justify-content-around flex-column mb-3">
          <div class="d-flex align-items-center justify-content-between gap-2" style="padding-right: 2.5rem;">
            <button id="btn-google-auth" type="button" class="nav-link text-start border-0 bg-transparent d-flex align-items-center gap-2 flex-grow-1 min-w-0" style="padding-right: 0.5rem;">
              <i class="fab fa-google"></i><span>Sign in with Google</span>
            </button>
            <button id="btn-theme-toggle" type="button" class="border-0 rounded-circle d-inline-flex align-items-center justify-content-center flex-shrink-0" style="width: 32px; height: 32px; background: color-mix(in srgb, var(--primary-color) 16%, transparent); color: var(--primary-color);" title="Mode Gelap" aria-label="Mode Gelap">
              <i class="fas fa-moon"></i>
            </button>
          </div>
          <hr style="border: 2px solid var(--white-color);">
          <a class="nav-link" href="#/rekening"><i class="fas fa-wallet"></i>&nbsp;&nbsp; Rekening</a>
          <a class="nav-link" href="#/wishlist"><i class="fas fa-star"></i>&nbsp;&nbsp; Wishlist</a>
          <a class="nav-link" href="#/analisis"><i class="fas fa-chart-line"></i>&nbsp;&nbsp; Analisis</a>
          <a class="nav-link" href="#/databases"><i class="fas fa-server"></i>&nbsp;&nbsp; Basis Data</a>
        </div>
        <div style="height: 15dvh;"></div>
      </div>
      <div class="navbar navbar-light">
        <a href="#/transactions" class="nav-link my-tooltip" data-tooltip="Dashboard" aria-label="Dashboard">
          <i class="fas fa-chart-pie"></i>
        </a>
        <div class="nav-link">
          <a href="#/record" class="special my-tooltip" data-tooltip="Transaksi" aria-label="Catat Transaksi">
            <i class="fas fa-money-bill-wave"></i>
          </a>
        </div>
        <button class="nav-link my-tooltip" data-tooltip="Menu" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
          aria-label="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>
    <div class="col"></div>
  </nav>

  <script defer src="https://cdn.datatables.net/select/3.0.1/js/dataTables.select.js" crossorigin="anonymous"></script>
