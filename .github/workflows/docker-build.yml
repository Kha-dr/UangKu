name: Build MCP Docker Image

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: ["main"]
    paths:
      - 'mcp-server/**'
  workflow_dispatch:

env:
  IMAGE_NAME: khad1r/kasin-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker tags
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            echo "DOCKER_TAGS=${{ env.IMAGE_NAME }}:${{ github.ref_name }},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV
          else
            echo "DOCKER_TAGS=${{ env.IMAGE_NAME }}:sha-${{ github.sha }},${{ env.IMAGE_NAME }}:latest" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: mcp-server
          file: mcp-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.DOCKER_TAGS }}
          platforms: linux/amd64

      - name: Test Docker image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:sha-${{ github.sha }} bun --version
